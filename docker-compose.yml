services:
  roomreserve.api:
    build:
      context: .
      dockerfile: src/RoomReserve.API/Dockerfile
    ports:
      - "5123:8080"
    environment:
      ConnectionStrings__RoomReserveDb: "Server=sqlserver,1433;Database=RoomReserveDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      ACCEPT_EULA: ${MSSQL_ACCEPT_EULA}
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
